
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratik Araçlar</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;text-align:center}
header{padding:35px 15px;background:#172554}
h1{color:#60a5fa}
main{max-width:650px;margin:25px auto;padding:15px}
.card{background:#1e293b;padding:22px;margin:16px 0;border-radius:16px}
input{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:0;margin:10px 0}
button{background:#3b82f6;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:16px}
.result{color:#93c5fd;font-size:20px}
footer{padding:25px;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>Pratik Araçlar 🚀</h1>
<p>Günlük işlerini kolaylaştıran ücretsiz araçlar.</p>
</header>
<main>
<div class="card">
<h2>🧮 Hesap Makinesi</h2>
<input id="a" type="number" placeholder="İlk sayı">
<input id="b" type="number" placeholder="İkinci sayı">
<button onclick="hesapla('+')">Topla +</button>
<button onclick="hesapla('-')">Çıkar −</button>
<button onclick="hesapla('*')">Çarp ×</button>
<button onclick="hesapla('/')">Böl ÷</button>
<p id="sonuc" class="result">Sonuç burada görünür.</p>
</div>
<div class="card">
<h2>📝 Kelime Sayacı</h2>
<input id="metin" placeholder="Metnini buraya yaz">
<button onclick="say()">Kelime say</button>
<p id="kelime" class="result">0 kelime</p>
</div>
</main>
<footer>Pratik Araçlar © 2026 · Ücretsiz kullanım</footer>
<script>
function hesapla(islem){
let a=Number(document.getElementById('a').value);
let b=Number(document.getElementById('b').value);
if(document.getElementById('a').value===''||document.getElementById('b').value===''){document.getElementById('sonuc').textContent='İki sayıyı da gir.';return}
if(islem==='/'&&b===0){document.getElementById('sonuc').textContent='Sıfıra bölünemez.';return}
let r=islem==='+'?a+b:islem==='-'?a-b:islem==='*'?a*b:a/b;
document.getElementById('sonuc').textContent='Sonuç: '+r;
}
function say(){
let t=document.getElementById('metin').value.trim();
document.getElementById('kelime').textContent=(t?t.split(/\s+/).length:0)+' kelime';
}
</script>
</body>
</html>
