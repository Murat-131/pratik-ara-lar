
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratik Araçlar</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;text-align:center}
header{padding:35px 15px;background:#172554}
h1{color:#60a5fa}
main{max-width:650px;margin:25px auto;padding:15px}
.card{background:#1e293b;padding:22px;margin:16px 0;border-radius:16px}
input{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:0;margin:10px 0}
button{background:#3b82f6;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer;margin:4px}
.result{color:#93c5fd;font-size:20px}
footer{padding:25px;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>Pratik Araçlar 🚀</h1>
<p>Günlük işlerini kolaylaştıran ücretsiz araçlar.</p>
</header>

<main>
<div class="card">
<h2>🧮 Hesap Makinesi</h2>
<input id="a" type="number" placeholder="İlk sayı">
<input id="b" type="number" placeholder="İkinci sayı">
<button onclick="hesapla('+')">Topla +</button>
<button onclick="hesapla('-')">Çıkar −</button>
<button onclick="hesapla('*')">Çarp ×</button>
<button onclick="hesapla('/')">Böl ÷</button>
<p id="sonuc" class="result">Sonuç burada görünür.</p>
</div>

<div class="card">
<h2>📝 Kelime Sayacı</h2>
<input id="metin" placeholder="Metnini buraya yaz">
<button onclick="say()">Kelime say</button>
<p id="kelime" class="result">0 kelime</p>
</div>

<div class="card">
<h2>📊 Yüzde Hesaplama</h2>
<input id="sayi" type="number" placeholder="Sayı (Örn. 200)">
<input id="oran" type="number" placeholder="Yüzde (Örn. 15)">
<button onclick="yuzdeHesapla()">Hesapla</button>
<p id="yuzdeSonuc" class="result">Sonuç burada görünecek.</p>
</div>
</main>

<footer>Pratik Araçlar © 2026 · Ücretsiz kullanım</footer>

<script>
function hesapla(islem){
const x=document.getElementById('a').value;
const y=document.getElementById('b').value;
const sonuc=document.getElementById('sonuc');

if(x===''||y===''){
sonuc.textContent='İki sayıyı da gir.';
return;
}

const a=Number(x);
const b=Number(y);

if(islem==='/'&&b===0){
sonuc.textContent='Sıfıra bölünemez.';
return;
}

const r=islem==='+'?a+b:islem==='-'?a-b:islem==='*'?a*b:a/b;
sonuc.textContent='Sonuç: '+r;
}

function say(){
const t=document.getElementById('metin').value.trim();
document.getElementById('kelime').textContent=(t?t.split(/\s+/).length:0)+' kelime';
}

function yuzdeHesapla(){
const x=document.getElementById('sayi').value;
const y=document.getElementById('oran').value;
const sonuc=document.getElementById('yuzdeSonuc');

if(x===''||y===''){
sonuc.textContent='Sayıyı ve yüzde oranını gir.';
return;
}

sonuc.textContent='Sonuç: '+(Number(x)*Number(y)/100);
}
</script>
</body>
</html>
